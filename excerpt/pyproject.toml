[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "food-excerpt"
version = "0.1.0"
description = "Create an excerpt dataset with copied images and filtered JSON-LD annotations."
requires-python = ">=3.10,<3.14"
dependencies = []

[project.scripts]
food-excerpt = "excerpt.main:main"

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["excerpt", "excerpt.*"]
