[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "image-annotation"
version = "0.1.0"
description = "Food annotation and USDA enrichment module."
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate>=1.13.0",
    "dotenv==0.9.9",
    "openai==1.76.0",
    "pydantic",
    "requests==2.32.5",
    "torch==2.7.1",
    "transformers==4.57.1",
]

[project.scripts]
image-annotation = "main:main"
image-annotation-apply-corrections = "apply_corrections:main"
image-annotation-eval = "evaluation:main"

[tool.setuptools]
py-modules = [
    "apply_corrections",
    "evaluation",
    "main",
    "get_from_usda",
]
