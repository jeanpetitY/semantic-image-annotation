[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "food-inference"
version = "0.1.0"
description = "Food classification and nutrient-generation inference module."
requires-python = ">=3.10,<3.14"
dependencies = [
    "accelerate==1.11.0",
    "datasets==4.3.0",
    "fastapi>=0.116.1",
    "huggingface_hub>=0.35.3",
    "numpy",
    "pandas>=2.3.3",
    "pillow==11.1.0",
    "pinecone>=7.3.0",
    "python-dotenv>=1.1.1",
    "requests==2.32.5",
    "scikit-learn==1.6.1",
    "sentence-transformers>=5.1.1",
    "torchvision==0.22.1",
    "torch==2.7.1",
    "tqdm>=4.67.1",
    "transformers==4.57.1",
]

[project.scripts]
food-inference = "inference.main:main"

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["inference", "inference.*"]
