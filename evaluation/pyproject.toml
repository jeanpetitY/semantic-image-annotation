[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "food-evaluation"
version = "0.1.0"
description = "Evaluation module for nutrient-generation predictions."
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas>=2.3.3",
]

[project.scripts]
food-evaluation = "evaluation.evaluator:main"

[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["evaluation", "evaluation.*"]
